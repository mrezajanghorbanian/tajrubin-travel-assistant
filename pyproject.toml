[project]
name = "tajrubin-travel-assistant"
version = "0.1.0"
description = "Local-first AI travel assistant with grounded travel knowledge and itinerary planning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]