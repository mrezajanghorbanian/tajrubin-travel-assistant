name: Public Repository Security

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install bandit pip-audit detect-secrets

      - name: Run test suite
        run: |
          python -m pytest tests -q

      - name: Run repository security gate
        run: |
          python tools/security_gate.py

      - name: Static security analysis
        run: |
          bandit -r app tools -q

      - name: Dependency vulnerability audit
        run: |
          pip-audit

      - name: Secret scan
        shell: bash
        run: |
          SCAN_FILE="$(mktemp)"

          detect-secrets scan \
            --all-files \
            --exclude-files '(^|/)\.git(/|$)' \
            --exclude-files '(^|/)\.venv(/|$)' \
            --exclude-files '(^|/)\.pytest_cache(/|$)' \
            > "$SCAN_FILE"

          python - "$SCAN_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          results = data.get("results", {})

          if results:
              print("Potential secrets detected:")
              for filename, findings in results.items():
                  print(f"- {filename}: {len(findings)} finding(s)")
              raise SystemExit(1)

          print("NO_SECRETS_DETECTED")
          PY